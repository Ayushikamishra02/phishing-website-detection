name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: |
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Lint
        run: ruff check src api app tests
      - name: Tests (URL extractor, pipeline, API with committed models)
        run: pytest -v
      - name: Smoke-train on bundled sample
        run: python -m phishguard.train --sample

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t phishguard .
